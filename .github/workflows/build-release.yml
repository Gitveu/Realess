name: Build Release APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'realness/**'
      - 'tiny-realness/**'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 34 platform & build-tools
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Decode release keystore from GitHub Secrets
        env:
          REALNESS_KEYSTORE_BASE64: ${{ secrets.REALNESS_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$REALNESS_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > realness-release.keystore

      - name: Build realness (Gradle Release)
        working-directory: realness
        env:
          REALNESS_KEYSTORE_PATH: ${{ github.workspace }}/realness-release.keystore
          REALNESS_KEYSTORE_PASSWORD: ${{ secrets.REALNESS_KEYSTORE_PASSWORD }}
          REALNESS_KEY_ALIAS: ${{ secrets.REALNESS_KEY_ALIAS }}
          REALNESS_KEY_PASSWORD: ${{ secrets.REALNESS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || (sleep 10 && ./gradlew assembleRelease --no-daemon)

      - name: Build realness-tiny (tinyapk-lab Release)
        env:
          REALNESS_KEYSTORE_PATH: ${{ github.workspace }}/realness-release.keystore
          REALNESS_KEYSTORE_PASSWORD: ${{ secrets.REALNESS_KEYSTORE_PASSWORD }}
          REALNESS_KEY_ALIAS: ${{ secrets.REALNESS_KEY_ALIAS }}
          REALNESS_KEY_PASSWORD: ${{ secrets.REALNESS_KEY_PASSWORD }}
        run: |
          chmod +x tiny-realness/build.sh
          ./tiny-realness/build.sh

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp realness/app/build/outputs/apk/release/realness\ *.apk dist/
          cp realness-tiny\ *.apk dist/
          ls -lh dist/

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: realness-release-apks
          path: dist/*.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' realness/app/build.gradle.kts | head -n 1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --clobber
          else
            gh release create "$TAG" dist/*.apk \
              --title "realness ${TAG}" \
              --generate-notes
          fi
